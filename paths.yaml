# Canonical path configuration for the Desmognathus TE analysis project.
#
# This file is the single path contract for the repo.

# Input data used by the core TE processing pipeline.
input_data:
  root: "input_data"
  genomes: "input_data/genomes"
  phylogeny: "input_data/phylogeny"
  dnaPipeTE: "input_data/dnaPipeTE"
  repeatmasker: "input_data/repeatmasker"
  morphological: "input_data/morphological"
  ectopic_recombination: "input_data/ectopic_recombination"
  lookup_table: "input_data/lookup_table.txt"

# Local generated workspace used by processing scripts.
interim:
  root: "interim"

results:
  root: "results"
  data: "results/data"
  reports: "results/reports"
  phylogeny: "results/phylogeny"
  figures:
    root: "results/figures"
    diversity: "results/figures/diversity"
    pca: "results/figures/pca"
    landscape: "results/figures/landscape"
    phylogeny: "results/figures/phylogeny"
    phylo_landscape: "results/figures/phylo_landscape"
    phylo_signal: "results/figures/phylo_signal"
  tables:
    root: "results/tables"
    diversity: "results/tables/diversity"
    pca: "results/tables/pca"
    phylogeny: "results/tables/phylogeny"
    phylo_signal: "results/tables/phylogenetic_signal"
  landscapes: "results/landscapes"

scripts:
  processing: "scripts/processing"
  visualization: "scripts/visualization"
  python: "scripts/python"
  R: "scripts/R"
