[activation]
scripts = ["scripts/activate_pixi.sh"]

[feature.analysis.dependencies]
python = "==3.13.11"
nodejs = "24.*"

[feature.analysis.pypi-dependencies]
"biopython" = "==1.88"
"numpy" = "==2.5.2"
"openpyxl" = "==3.1.5"
"pandas" = "==3.0.5"
"python-docx" = "==1.2.0"
"pytest" = "==9.1.1"
"ruff" = "==0.16.2"

[feature.bonsai.dependencies]
python = "3.14.*"

[feature.bonsai.pypi-dependencies]
"matplotlib" = "==3.11.0"
"numpy" = "==2.4.6"
"scipy" = "==1.17.1"
"pandas" = "==3.0.3"
"scikit-learn" = "==1.9.0"
"ruamel.yaml" = "==0.19.1"
"psutil" = "==7.2.2"

[environments]
default = { features = ["analysis"] }
bonsai = { features = ["bonsai"] }

[tasks]
setup = "bash scripts/setup_r.sh"
check-env = "python scripts/check_environment.py"
check-python = "python scripts/check_environment.py --python-only"

[feature.analysis.tasks]
"status" = { cmd = "python -m scripts.project status" }
"catalog" = { cmd = "python -m scripts.project catalog" }
"publication" = { cmd = "python -m scripts.project publication && python -m scripts.project catalog" }
"refresh" = { cmd = "python -m scripts.project publication && python -m scripts.project catalog && python -m scripts.project validate" }
"identity" = { cmd = "python -m scripts.project identity" }
"validate" = { cmd = "python -m scripts.project validate" }
"test" = { cmd = "python -m pytest -q", depends-on = ["check-env", "validate"] }
"lint" = { cmd = "ruff check scripts tests analyses --exclude '*.ipynb'" }
"report" = { cmd = "bash scripts/run_r.sh Rscript scripts/publication/render_study_report.R", depends-on = ["figures", "validate"] }
"figure-review" = { cmd = "bash scripts/run_r.sh Rscript scripts/publication/render_figure_review.R", depends-on = ["figures", "validate"] }
"figure-data" = { cmd = "python scripts/publication/build_figure_data_workbook.py", depends-on = ["validate"] }
"methods-word" = { cmd = "python scripts/publication/build_methods_document.py --check" }
"figures" = { cmd = "bash scripts/run_r.sh Rscript scripts/publication/build_gbe_figures.R" }
"te-bonsai" = { cmd = "python analyses/01_transposable_elements/bonsai_comparison/compare_bonsai_to_pca.py check && python analyses/01_transposable_elements/bonsai_comparison/validate_strategy_localization.py check" }
"te-pca" = { cmd = "python analyses/01_transposable_elements/recompute_pca.py && bash scripts/run_r.sh Rscript analyses/01_transposable_elements/analyze_pca_structure.R" }
"path" = { cmd = "python analyses/03_phylogenetic_path/build_path_release.py && bash scripts/run_r.sh Rscript analyses/03_phylogenetic_path/run_path_analysis.R" }
"path-quick" = { cmd = "python analyses/03_phylogenetic_path/build_path_release.py && bash scripts/run_r.sh Rscript analyses/03_phylogenetic_path/run_path_analysis.R --quick" }

[feature.bonsai.tasks]
bonsai-rerun = "python scripts/run_bonsai.py refit"
bonsai-bootstrap-rerun = "python scripts/run_bonsai.py bootstrap"
