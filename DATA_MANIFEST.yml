version: 1
description: >
  Share-facing data contract for the Desmognathus TE analysis repository.
  Large sequencing/genome inputs remain local. Generated outputs are rebuilt
  under results/ and interim/ and are not source artifacts.

required_local_inputs:
  - path: input_data/lookup_table.txt
    kind: table
    status: local_required
    description: Active species-to-TE-resource mapping; not a microscopy specimen mapping.
  - path: path_analysis/data/templates/source_manifest.csv
    kind: provenance_table
    status: tracked_required
    description: Source and genomic-resource decisions, including accession-specific inclusion roles.
  - path: path_analysis/data/templates/species_taxonomy_crosswalk.csv
    kind: provenance_table
    status: tracked_required
    description: Taxonomic search names and explicit resource-specific naming exceptions.
  - path: input_data/phylogeny/desmo900dated_test.tre
    kind: tree
    status: local_required
    description: Dated Desmognathus phylogeny used by comparative scripts.
  - path: input_data/phylogeny/stewart_wiens_2025/Supplementary_File_S3.nex
    kind: external_tree
    status: local_required_for_published_tree_sensitivity
    description: Stewart-Wiens 2025 optimal time-calibrated tree, publisher Supplementary File S3; exact archive and hash are in the corrected source registry.
  - path: input_data/phylogeny/stewart_wiens_2025/Supplementary_File_S4.nex
    kind: external_tree_set
    status: local_required_for_tree_uncertainty
    description: Stewart-Wiens 2025 set of 200 time-calibrated bootstrap trees, publisher Supplementary File S4.
  - path: input_data/dnaPipeTE/*_reads_per_component_and_annotation
    kind: directory_glob
    status: local_required
    description: dnaPipeTE per-computational-run outputs from genomic WGS; retry suffixes are not biological replicates and require one-output-per-SRX selection.
  - path: input_data/repeatmasker/*.align
    kind: directory_glob
    status: local_required
    description: RepeatMasker alignments over dnaPipeTE Trinity repeat contigs, not GCA genome assemblies.
  - path: input_data/ectopic_recombination/GCA_*_tabout.csv
    kind: directory_glob
    status: local_required
    description: TEsorter/LTR annotation tables for terminal:internal deletion-footprint proxy summaries; not a validated ectopic-recombination rate.
  - path: input_data/ectopic_recombination/*.depth.txt
    kind: directory_glob
    status: local_required_for_ectopic_depth
    description: Per-element depth files consumed by scripts/processing/ec.py.

path_analysis_imports:
  - path: path_analysis/data/external/derived/cellprofiler_final_species_results.csv
    kind: imported_snapshot
    status: historical_bridge_not_absolute_genome_size
    description: Preserved species-level image-IOD rescaling imported from CellProfiler/YOLO; not approved as an absolute C-value.
  - path: path_analysis/data/external/derived/cellprofiler_species_morphology_summary.csv
    kind: imported_snapshot
    status: required_for_shareable_path_analysis
    description: Species-level linked cell/nucleus morphology summary.
  - path: path_analysis/data/external/derived/cellprofiler_linked_genome_image_trace.csv
    kind: imported_sidecar
    status: required_for_image_traceability
    description: Per-image source/mask/tile/run traceability for genome estimates.
  - path: path_analysis/data/external/derived/cellprofiler_genome_state_summary.csv
    kind: imported_sidecar
    status: required_for_genome_reconstruction_audit
    description: State-level support and reconstruction metadata.
  - path: path_analysis/data/external/derived/cellprofiler_final_species_results_reconstruction.json
    kind: imported_sidecar
    status: required_for_genome_reconstruction_audit
    description: Machine-readable reconstruction rule and hashes for the species genome-size bundle.
  - path: path_analysis/data/external/derived/cellprofiler_species_morphology_image_trace.csv
    kind: imported_sidecar
    status: required_for_image_traceability
    description: Per-image source/mask/tile/run traceability for linked morphology measurements.
  - path: path_analysis/data/external/derived/cellprofiler_traceability_audit_summary.csv
    kind: imported_sidecar
    status: required_for_image_traceability
    description: Compact source-image, tile-manifest, mask, and ROI retention summary.
  - path: path_analysis/data/external/derived/cellprofiler_traceability_audit_gaps.csv
    kind: imported_sidecar
    status: required_for_image_traceability
    description: Gap table for missing CellProfiler trace artifacts.
  - path: path_analysis/data/external/derived/cellprofiler_source_discovery.json
    kind: imported_sidecar
    status: required_for_image_traceability
    description: Source files and active CellProfiler run tags used for the imported snapshots.

corrected_repeat_landscape:
  - path: results/data/corrected/repeat_landscape/repeatmasker_divergence_landscape_analysis18_v1.csv
    kind: corrected_derived
    status: required_for_repeat_landscape_review
    description: One-percent divergence bins by species and native RepeatMasker order; denominator is inclusive corrected query-coordinate aligned hit bp within species, not genome span.
  - path: results/data/corrected/repeat_landscape/repeatmasker_divergence_landscape_analysis18_v1.manifest.json
    kind: integrity_manifest
    status: required_for_repeat_landscape_review
    description: Confirms conservation of 5,132,397 corrected hits and 1,155,346,511 inclusive aligned bp without running an upstream annotation tool.

corrected_microscopy_audit:
  - path: results/data/corrected/microscopy/microscopy_panel_support_analysis18_v1.csv
    kind: corrected_derived
    status: required_for_morphology_sensitivity
    description: Final-18 specimen/image support, manual-decision coverage, and literal-largest overlap.
  - path: results/data/corrected/microscopy/microscopy_estimand_sensitivity_analysis18_v1.csv
    kind: corrected_derived
    status: required_for_morphology_sensitivity
    description: Six declared cell/nucleus estimators; none is silently labeled typical species size.
  - path: results/data/corrected/microscopy/microscopy_relative_iod_sensitivity_analysis18_v1.csv
    kind: corrected_derived
    status: sensitivity_only
    description: Relative nuclear-IOD indices; absolute picogram interpretation is withdrawn.
  - path: results/data/corrected/microscopy/microscopy_segmentation_validation_analysis18_v1.csv
    kind: validation_audit
    status: publication_blocker
    description: Two-tile archived-cell/current-nucleus benchmark; no focal species represented.
  - path: results/data/corrected/microscopy/microscopy_source_registry_analysis18_v1.csv
    kind: provenance_registry
    status: required_for_release_audit
    description: Source hashes, archived mask/model artifacts, run plan, and validation runtime versions.

corrected_path_audit:
  - path: results/data/corrected/path_analysis/corrected_path_input_sensitivity_analysis18_v1.csv
    kind: corrected_derived
    status: required_for_path_sensitivity
    description: Final-18 six-morphology by three-relative-IOD input cube; contains no absolute genome-size field.
  - path: results/data/corrected/path_analysis/corrected_path_data_sensitivity_rankings_analysis18_v1.csv
    kind: corrected_model_output
    status: exploratory_only
    description: Complete CICc/global-fit ranking surface for data specifications and focal/published main trees.
  - path: results/data/corrected/path_analysis/corrected_path_tree_sensitivity_rankings_analysis18_v1.csv
    kind: corrected_model_output
    status: exploratory_only
    description: Complete rankings over the published main tree and 200 published time trees.
  - path: results/data/corrected/path_analysis/corrected_path_leave_one_out_rankings_analysis18_v1.csv
    kind: corrected_model_output
    status: exploratory_only
    description: Leave-one-species-out rankings and global-fit gates.
  - path: results/data/corrected/path_analysis/corrected_path_simulation_calibration_analysis18_v1.csv
    kind: simulation_calibration
    status: required_for_small_sample_audit
    description: Actual-tree false-selection and exact-model-recovery calibration at n=18.
  - path: results/data/corrected/path_analysis/corrected_path_simulation_edge_calibration_analysis18_v1.csv
    kind: simulation_calibration
    status: required_for_small_sample_audit
    description: Generating-edge coefficient bias, RMSE, and approximate interval coverage.
  - path: results/data/corrected/path_analysis/publication_release_gate_matrix_analysis18_v1.csv
    kind: release_gate
    status: required_for_sharing
    description: Machine-readable permitted-language boundary across TE, tree, microscopy, genome-size, and path layers.
  - path: notebooks/Desmognathus_publication_audit_analysis18_v1.ipynb
    kind: executable_review_notebook
    status: required_for_collaborator_review
    description: Executable final-18 workbench with exact corrected inputs, figures, and weird-result queue.
  - path: notebooks/Desmognathus_publication_audit_analysis18_v1.manifest.json
    kind: notebook_integrity_manifest
    status: required_for_collaborator_review
    description: Executed-cell/error audit, notebook SHA-256, and hashes for required corrected review artifacts.

research_review_notebook_bundle:
  - path: notebooks/research_review/README.md
    kind: review_bundle_guide
    status: required_for_collaborator_review
    description: Canonical eight-notebook order, claim boundaries, rebuild instructions, and optional microscopy HTML-viewer behavior.
  - path: notebooks/research_review/01_phylogeny_tree_trimming.ipynb
    kind: executable_review_notebook
    status: required_for_collaborator_review
    description: Tree trimming, source provenance, exact-tip audit, and published-tree uncertainty.
  - path: notebooks/research_review/02_data_tables_and_provenance.ipynb
    kind: executable_review_notebook
    status: required_for_collaborator_review
    description: Identity crosswalk, independent evidence streams, completeness, and artifact catalog.
  - path: notebooks/research_review/03_repeat_analysis_te34.ipynb
    kind: executable_review_notebook
    status: required_for_collaborator_review
    description: TE34 sequencing quality, composition, diversity, cross-taxon context, and compositional PCA/clustering.
  - path: notebooks/research_review/04_ltr_deletion_footprint.ipynb
    kind: executable_review_notebook
    status: required_for_collaborator_review
    description: Zero-aware terminal:internal LTR deletion-footprint and mapping-proxy audit.
  - path: notebooks/research_review/05_cell_modeling_and_measurement.ipynb
    kind: executable_review_notebook
    status: required_for_collaborator_review
    description: Optional mask viewers, segmentation gates, linked morphometry, relative IOD, and phylogenetic trait figures.
  - path: notebooks/research_review/06_genome_size_estimation.ipynb
    kind: executable_review_notebook
    status: required_for_collaborator_review
    description: Complete frozen 721-nucleus quality-matched IOD analysis and conditional fuscus-anchored genome-size estimates.
  - path: notebooks/research_review/07_cell_nucleus_genome_path_analysis.ipynb
    kind: executable_review_notebook
    status: required_for_collaborator_review
    description: Full genome20 d-separation/CICc analysis with exhaustive equivalence classes, measurement/tree/species/evolutionary-model sensitivity, simulation calibration, and no uniquely identified causal orientation.
  - path: notebooks/research_review/08_integrated_phylogenetic_path_analysis.ipynb
    kind: executable_review_notebook
    status: required_for_collaborator_review
    description: Exploratory integrated TE/IOD/morphology candidate-path fits, global gates, tree and leave-one-out sensitivity, and simulation calibration.
  - path: notebooks/research_review/research_review_manifest.json
    kind: notebook_bundle_integrity_manifest
    status: required_for_collaborator_review
    description: SHA-256, execution, error, external-process, optional-viewer, and figure gates for all eight notebooks.

tracked_small_external_snapshots:
  - path: path_analysis/data/external/raw/Pyron_Beamer_conanti_fuscus_Appendix_S1.csv
    kind: external_raw_snapshot
    status: tracked_requires_license_and_sensitivity_review
    description: Specimen-level external morphometric/locality snapshot with county and coordinates.

generated_outputs:
  - path: results/
    status: ignored_generated
    description: Tables, figures, reports, and model outputs rebuilt by scripts.
  - path: interim/
    status: ignored_generated
    description: Temporary processing state; scripts should not depend on stale contents.
  - path: path_analysis/data/derived/
    status: tracked_small_derived_or_rebuilt
    description: Small analysis tables, panel definitions, and provenance audits rebuilt by path_analysis scripts.
  - path: path_analysis/results/
    status: ignored_generated
    description: Path-model rankings, edge tables, and model figures rebuilt from panel CSVs when needed.

workflow_steps:
  - id: setup_check
    command: scripts/run_in_dusky.sh python verify_setup.py
    inputs:
      - DATA_MANIFEST.yml
      - paths.yaml
      - input_data/
      - path_analysis/data/external/derived/
    outputs: []
    mutates: false
  - id: core_te_tables
    command: scripts/run_in_dusky.sh python scripts/processing/dnaPipe.py && scripts/run_in_dusky.sh python scripts/processing/repeatmask.py && scripts/run_in_dusky.sh python scripts/processing/divergence.py && scripts/run_in_dusky.sh python scripts/processing/diversity_stats.py
    inputs:
      - input_data/dnaPipeTE/
      - input_data/repeatmasker/
      - input_data/lookup_table.txt
    outputs:
      - results/data/dnaPipeTE_order_breakdown.csv
      - results/data/dnaPipeTE_superfamily_breakdown.csv
      - results/data/repeatmasker_detailed_classification_combined.csv
      - results/data/divergence/divergence_summary_statistics_by_species.csv
      - results/data/diversity_order_stats.csv
      - results/data/diversity_superfamily_stats.csv
    mutates: true
  - id: corrected_dnapipete_audits
    command: scripts/run_in_dusky.sh python scripts/processing/audit_dnapipete_mass_accounting.py && scripts/run_in_dusky.sh python scripts/processing/build_dnapipete_absolute_load_sensitivity.py
    inputs:
      - results/data/dnaPipeTE_merged_classifications.csv
      - results/data/dnaPipeTE_class_breakdown.csv
      - results/data/dnaPipeTE_order_breakdown.csv
      - results/data/dnaPipeTE_superfamily_breakdown.csv
      - path_analysis/data/derived/panels/te_genome_primary_mediumplus.csv
      - input_data/lookup_table.txt
    outputs:
      - results/data/corrected/dnapipete/dnapipete_mass_accounting_analysis18_v2.csv
      - results/data/corrected/dnapipete/dnapipete_absolute_load_sensitivity_analysis18_v1.csv
    mutates: true
  - id: ectopic_tables
    command: scripts/run_in_dusky.sh python scripts/processing/ec.py
    inputs:
      - input_data/ectopic_recombination/GCA_*_tabout.csv
      - input_data/ectopic_recombination/*.depth.txt
      - input_data/ectopic_recombination/combined_sequences.fasta.rexdb-metazoa.cls.tsv
    outputs:
      - results/data/ectopic_recombination_master.csv
      - results/data/ectopic_recombination_filtered_3000bp_5+domains_no_unknown_species.csv
    mutates: true
  - id: cellprofiler_import
    command: scripts/run_in_dusky.sh python path_analysis/scripts/pull_cellprofiler_estimates.py
    inputs:
      - ../cellprofiler_test/output/runs/mixed_cellpose_yolo_full_dataset_v1/linkage/
    outputs:
      - path_analysis/data/external/derived/cellprofiler_final_species_results.csv
      - path_analysis/data/external/derived/cellprofiler_species_morphology_summary.csv
      - path_analysis/data/external/derived/cellprofiler_linked_genome_image_trace.csv
      - path_analysis/data/external/derived/cellprofiler_species_morphology_image_trace.csv
      - path_analysis/data/external/derived/cellprofiler_traceability_audit_summary.csv
      - path_analysis/data/external/derived/cellprofiler_traceability_audit_gaps.csv
    mutates: true
  - id: path_analysis_tables
    command: scripts/run_in_dusky.sh python path_analysis/scripts/build_master_dataset.py && scripts/run_in_dusky.sh python path_analysis/scripts/prepare_te_features.py && scripts/run_in_dusky.sh python path_analysis/scripts/prepare_curated_organismal_traits.py && scripts/run_in_dusky.sh Rscript path_analysis/scripts/build_phylogenetic_trait_imputation.R && scripts/run_in_dusky.sh python path_analysis/scripts/build_te_model_panel.py && scripts/run_in_dusky.sh python path_analysis/scripts/prepare_ltr_history_features.py && scripts/run_in_dusky.sh python path_analysis/scripts/build_path_input_master.py && scripts/run_in_dusky.sh python path_analysis/scripts/build_analysis_panels.py && scripts/run_in_dusky.sh python path_analysis/scripts/audit_source_traceability.py
    inputs:
      - results/data/
      - input_data/phylogeny/desmo900dated_test.tre
      - path_analysis/data/templates/
      - path_analysis/data/external/
    outputs:
      - path_analysis/data/derived/master_species_table.csv
      - path_analysis/data/derived/te_path_features.csv
      - path_analysis/data/derived/path_input_master.csv
      - path_analysis/data/derived/analysis_panel_summary.csv
      - path_analysis/data/derived/analysis_species_readiness.csv
      - path_analysis/data/derived/source_traceability_gaps.csv
    mutates: true
  - id: corrected_path_release_audit
    command: scripts/run_in_dusky.sh python scripts/processing/build_corrected_path_inputs.py && scripts/run_in_dusky.sh Rscript scripts/processing/audit_corrected_path_models.R --phase all && scripts/run_in_dusky.sh Rscript scripts/processing/simulate_corrected_path_calibration.R && scripts/run_in_dusky.sh python scripts/processing/summarize_corrected_path_audit.py && scripts/run_in_dusky.sh python scripts/processing/build_publication_audit_notebook.py && scripts/run_in_dusky.sh jupyter nbconvert --to notebook --execute notebooks/Desmognathus_publication_audit_analysis18_v1.ipynb --inplace --ExecutePreprocessor.timeout=600 && scripts/run_in_dusky.sh python scripts/processing/audit_publication_notebook.py
    inputs:
      - results/data/corrected/diversity_pca/
      - results/data/corrected/ectopic/
      - results/data/corrected/microscopy/
      - results/data/corrected/phylogeny/
    outputs:
      - results/data/corrected/path_analysis/
      - results/figures/corrected/path_analysis/
      - plans/publication-readiness-deep-audit/corrected_path_analysis_audit_analysis18_v1.md
      - notebooks/Desmognathus_publication_audit_analysis18_v1.ipynb
    mutates: true
  - id: research_review_notebook_bundle
    command: scripts/run_in_dusky.sh python scripts/processing/build_corrected_repeat_landscape.py && scripts/run_in_dusky.sh python scripts/processing/build_research_review_notebooks.py && scripts/run_in_dusky.sh Rscript scripts/processing/build_audited_historical_style_figures.R && scripts/run_in_dusky.sh Rscript path_analysis/scripts/run_cell_nucleus_genome_phylogenetic_path_analysis.R && scripts/run_in_dusky.sh python path_analysis/scripts/build_cell_nucleus_genome_path_presentation.py && bash -lc 'for notebook in notebooks/research_review/[0-9][0-9]_*.ipynb; do scripts/run_in_dusky.sh jupyter nbconvert --to notebook --execute "$notebook" --inplace --ExecutePreprocessor.timeout=600 || exit 1; done' && scripts/run_in_dusky.sh python path_analysis/scripts/build_frozen_genome_iod_notebook.py --finalize && scripts/run_in_dusky.sh python scripts/processing/audit_research_review_notebooks.py
    inputs:
      - results/data/corrected/
      - results/figures/corrected/
      - results/data/corrected/repeatmasker_detailed_classification_hit_level_analysis18_v1.csv
      - ../cellprofiler_test/output/
    outputs:
      - results/data/corrected/repeat_landscape/
      - results/data/research_review/
      - results/figures/research_review/
      - notebooks/research_review/
    mutates: true
