name: Dusky
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.8
  - pandas
  - numpy
  - matplotlib
  - biopython
  - jupyterlab
  - seaborn
  - scikit-image
  - r-base>=4.0
  - r-tidyverse
  - r-ggplot2
  - r-viridis
  - r-dplyr
  - r-gridextra
  # Phylogenetic analysis packages (added 2026-01-31)
  - r-ape
  - r-phytools
  - r-geiger
  - r-caper
  - r-vegan
  - r-nlme
  - r-pheatmap
  - r-rcolorbrewer
  - r-compositions
  - r-factoextra
  - r-ggrepel
  - r-yaml
  - r-cluster
  - r-broom
  - r-igraph
  - r-tidygraph
  - r-graphlayouts
  - r-ggraph
  - r-ggm
  - r-phylolm
  - r-phylopath
  - bioconductor-graph
  - tesorter
  - pysam
  - bowtie2
  - samtools
  - bedtools
  - repeatmasker
  - trf
  - pip
  - pip:
    - tqdm
    - dask
    - pyyaml
    - scipy
