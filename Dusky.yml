name: Dusky
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.8
  - pandas
  - numpy
  - matplotlib
  - biopython
  - jupyterlab
  - seaborn
  - r-base>=4.0
  - r-tidyverse
  - r-ggplot2
  - r-viridis
  - r-dplyr
  - r-gridextra
  - tesorter
  - pysam
  - bowtie2
  - samtools
  - bedtools
  - repeatmasker
  - trf
  - pip
  - pip:
    - tqdm
